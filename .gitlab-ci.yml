variables:
  # Build configuration
  BOARD: "rockpi-4cplus"
  RELEASE: "noble"
  BRANCH: "edge"
  BUILD_MINIMAL: "no"
  BUILD_DESKTOP: "no"
  ARMBIAN_REPO: "https://github.com/armbian/build"
  USE_CCACHE: "yes"
  KERNEL_CPUS: "0"
  ALLOW_ROOT: "yes"
  COLUMNS: "160"
  MANAGE_ACNG: "no"
  ENABLE_EXTENSIONS: "preset-firstrun"
  
  # StorLoko DNS/SSL v4.0 Configuration - Per-Device IAM
  STORLOKO_API_URL: "https://api.storloko.com"
  STORLOKO_PROVISION_TOKEN: "$CI_PROVISION_TOKEN"
  
  # Device configuration (override via pipeline trigger)
  DEVICE_SERIAL: ""  # Set via API trigger or generate in prep stage
  # Pushover notifications
  PUSHOVER_API_TOKEN: "$CI_PUSHOVER_API_TOKEN"
  PUSHOVER_USER_KEY: "$CI_PUSHOVER_USER_KEY"

stages:
  - prepare
  - build
  - test

# Notification template job
.notify:
  image: registry.gh1.ac7.top/storloko/arm-builder/alpine-notify:1.0
  tags:
    - docker
  before_script:
    - apk add --no-cache curl jq
  allow_failure: true

cache:
  key: armbian-cache-${BOARD}
  paths:
    - armbian/cache/
    - armbian/.git/

#############################################
# STAGE 1: PREPARE DEVICE IAM CREDENTIALS
#############################################
prepare:iam:
  stage: prepare
  image: 
    name: registry.gh1.ac7.top/storloko/storloko-iam-provisioner:latest
    entrypoint: [""]
  tags:
    - docker
  before_script:
    - yum install -y jq openssl bind-utils
    - |
      if [ -z "$DEVICE_SERIAL" ]; then
        DEVICE_SERIAL="sl-$(openssl rand -hex 4)"
        echo "Generated serial: $DEVICE_SERIAL"
      else
        echo "Using provided serial: $DEVICE_SERIAL"
      fi
      echo "$DEVICE_SERIAL" > device_serial.txt
      DEVICE_HOSTNAME="device-${DEVICE_SERIAL}"
      echo "$DEVICE_HOSTNAME" > device_hostname.txt
      echo "=========================================="
      echo "StorLoko Per-Device IAM Credential Setup"
      echo "Serial: $DEVICE_SERIAL"
      echo "Hostname: $DEVICE_HOSTNAME"
      echo "=========================================="
  script:
    - |
      DEVICE_SERIAL=$(cat device_serial.txt)
      DEVICE_HOSTNAME=$(cat device_hostname.txt)
      IAM_USERNAME="storloko-device-${DEVICE_SERIAL}"
      echo "Creating IAM user: $IAM_USERNAME"
      
      aws iam create-user \
        --user-name "$IAM_USERNAME" \
        --tags Key=Device,Value="$DEVICE_SERIAL" Key=Type,Value=StorLokoDevice \
        2>/dev/null || echo "User already exists"
      
      POLICY_NAME="storloko-device-${DEVICE_SERIAL}-route53"
      
      cat > /tmp/iam-policy.json <<EOF
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "route53:GetChange",
              "route53:ListResourceRecordSets",
              "route53:ListHostedZones",
              "route53:ListHostedZonesByName"
            ],
            "Resource": "*"
          },
          {
            "Effect": "Allow",
            "Action": ["route53:ChangeResourceRecordSets"],
            "Resource": "arn:aws:route53:::hostedzone/${ROUTE53_ZONE_ID}",
            "Condition": {
              "ForAllValues:StringLike": {
                "route53:ChangeResourceRecordSetsNormalizedRecordNames": [
                  "${DEVICE_HOSTNAME}.cust.storloko.com",
                  "*.${DEVICE_HOSTNAME}.cust.storloko.com",
                  "_acme-challenge.${DEVICE_HOSTNAME}.cust.storloko.com",
                  "_acme-challenge.*.${DEVICE_HOSTNAME}.cust.storloko.com"
                ]
              }
            }
          }
        ]
      }
      EOF
      
      POLICY_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:policy/${POLICY_NAME}"
      aws iam delete-user-policy --user-name "$IAM_USERNAME" --policy-name "$POLICY_NAME" 2>/dev/null || true
      aws iam delete-policy --policy-arn "$POLICY_ARN" 2>/dev/null || true
      aws iam create-policy --policy-name "$POLICY_NAME" --policy-document file:///tmp/iam-policy.json --description "Route53 access for StorLoko device ${DEVICE_SERIAL}" || true
      aws iam attach-user-policy --user-name "$IAM_USERNAME" --policy-arn "$POLICY_ARN"
      
      OLD_KEYS=$(aws iam list-access-keys --user-name "$IAM_USERNAME" --query 'AccessKeyMetadata[*].AccessKeyId' --output text || echo "")
      for KEY in $OLD_KEYS; do
        aws iam delete-access-key --user-name "$IAM_USERNAME" --access-key-id "$KEY" || true
      done
      
      ACCESS_KEY_JSON=$(aws iam create-access-key --user-name "$IAM_USERNAME")
      echo "$ACCESS_KEY_JSON" | jq -r '.AccessKey.AccessKeyId' > device_aws_access_key_id.txt
      echo "$ACCESS_KEY_JSON" | jq -r '.AccessKey.SecretAccessKey' > device_aws_secret_access_key.txt
      
      cat > /tmp/dns-changes.json <<EOF
      {
        "Comment": "Initial DNS setup for StorLoko device ${DEVICE_SERIAL}",
        "Changes": [
          {"Action": "UPSERT", "ResourceRecordSet": {"Name": "${DEVICE_HOSTNAME}.cust.storloko.com", "Type": "A", "TTL": 300, "ResourceRecords": [{"Value": "1.1.1.1"}]}},
          {"Action": "UPSERT", "ResourceRecordSet": {"Name": "vaultwarden.${DEVICE_HOSTNAME}.cust.storloko.com", "Type": "A", "TTL": 300, "ResourceRecords": [{"Value": "1.1.1.1"}]}},
          {"Action": "UPSERT", "ResourceRecordSet": {"Name": "nextcloud.${DEVICE_HOSTNAME}.cust.storloko.com", "Type": "A", "TTL": 300, "ResourceRecords": [{"Value": "1.1.1.1"}]}},
          {"Action": "UPSERT", "ResourceRecordSet": {"Name": "immich.${DEVICE_HOSTNAME}.cust.storloko.com", "Type": "A", "TTL": 300, "ResourceRecords": [{"Value": "1.1.1.1"}]}},
          {"Action": "UPSERT", "ResourceRecordSet": {"Name": "jellyfin.${DEVICE_HOSTNAME}.cust.storloko.com", "Type": "A", "TTL": 300, "ResourceRecords": [{"Value": "1.1.1.1"}]}}
        ]
      }
      EOF
      
      aws route53 change-resource-record-sets --hosted-zone-id "${ROUTE53_ZONE_ID}" --change-batch file:///tmp/dns-changes.json
      
  artifacts:
    paths:
      - device_serial.txt
      - device_hostname.txt
      - device_aws_access_key_id.txt
      - device_aws_secret_access_key.txt
    expire_in: 1 week

#############################################
# STAGE 2: BUILD DEVICE IMAGE
#############################################
build:rockpi-4cplus:
  stage: build
  tags:
    - arm64
  image: storloko/armbian-builder:latest
  dependencies:
    - prepare:iam
  when: manual
  before_script:
    - DEVICE_SERIAL=$(cat device_serial.txt)
    - DEVICE_HOSTNAME=$(cat device_hostname.txt)
    - DEVICE_AWS_ACCESS_KEY_ID=$(cat device_aws_access_key_id.txt)
    - DEVICE_AWS_SECRET_ACCESS_KEY=$(cat device_aws_secret_access_key.txt)
    - git config --global --add safe.directory '*'
    - rm -rf armbian && git clone --depth 1 ${ARMBIAN_REPO} armbian && cd armbian
    - mkdir -p /armbian-cache/git-bare /armbian-cache/debs /armbian-cache/toolchain /armbian-cache/sources
    - mkdir -p cache && rm -rf cache/git-bare cache/debs cache/toolchain cache/sources
    - ln -s /armbian-cache/git-bare cache/git-bare
    - ln -s /armbian-cache/debs cache/debs
    - ln -s /armbian-cache/toolchain cache/toolchain
    - ln -s /armbian-cache/sources cache/sources
    - mkdir -p userpatches/extensions userpatches/overlay/root
  script:
    - echo "Starting Armbian build for ${DEVICE_SERIAL}..."
    - sudo ALLOW_ROOT=yes COLUMNS=${COLUMNS} USE_CCACHE=${USE_CCACHE} ENABLE_EXTENSIONS=${ENABLE_EXTENSIONS} ./compile.sh BOARD=${BOARD} BRANCH=${BRANCH} RELEASE=${RELEASE} BUILD_MINIMAL=${BUILD_MINIMAL} BUILD_DESKTOP=${BUILD_DESKTOP} KERNEL_CONFIGURE=no COMPRESS_OUTPUTIMAGE="sha,xz"
  after_script:
    - |
      if [ -d "armbian/output/images" ]; then
        DEVICE_SERIAL=$(cat device_serial.txt)
        BUILD_DATE=$(date +%Y-%m-%d)
        cd armbian/output/images/
        for file in *.img*; do
          [ -f "$file" ] && mv "$file" "${DEVICE_SERIAL}-${file}"
        done
        for file in *; do
          curl -X MKCOL "http://repo1.ac7.top/storloko-builds/${BUILD_DATE}/" || true
          curl -X MKCOL "http://repo1.ac7.top/storloko-builds/${BUILD_DATE}/${DEVICE_SERIAL}/" || true
          curl -T "$file" "http://repo1.ac7.top/storloko-builds/${BUILD_DATE}/${DEVICE_SERIAL}/$file"
        done
      fi
  artifacts:
    paths:
      - device_serial.txt
      - device_hostname.txt
    expire_in: 1 week
  timeout: 3h

# Board variants
build:orangepi5-ultra:
  extends: build:rockpi-4cplus
  variables:
    BOARD: "orangepi5-ultra"
    BRANCH: "vendor"
  when: manual

build:uefi-x86:
  extends: build:rockpi-4cplus
  variables:
    BOARD: "uefi-x86"
    BRANCH: "edge"
  when: manual

build:orangepi4-lts:
  extends: build:rockpi-4cplus
  variables:
    BOARD: "orangepi4-lts"
    BRANCH: "edge"
    RELEASE: "noble"
  when: manual

build:orangepi5pro:
  extends: build:rockpi-4cplus
  variables:
    BOARD: "orangepi5pro"
    BRANCH: "edge"
    RELEASE: "noble"
  when: manual

build:rpi4b:
  extends: build:rockpi-4cplus
  variables:
    BOARD: "rpi4b"
  when: manual

#############################################
# NOTIFICATIONS
#############################################
notify:prepare-complete:
  extends: .notify
  stage: prepare
  dependencies:
    - prepare:iam
  when: on_success
  script:
    - |
      curl -s --form-string "token=${PUSHOVER_API_TOKEN}" --form-string "user=${PUSHOVER_USER_KEY}" \
        --form-string "title=StorLoko: Prepare Complete" \
        --form-string "message=IAM setup complete for $(cat device_serial.txt)" \
        https://api.pushover.net/1/messages.json

notify:prepare-failed:
  extends: .notify
  stage: prepare
  when: on_failure
  script:
    - |
      curl -s --form-string "token=${PUSHOVER_API_TOKEN}" --form-string "user=${PUSHOVER_USER_KEY}" \
        --form-string "title=StorLoko: Prepare Failed" --form-string "priority=1" \
        https://api.pushover.net/1/messages.json
