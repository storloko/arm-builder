variables:
  # Build configuration
  BOARD: "rockpi-4cplus"
  RELEASE: "noble"
  BRANCH: "edge"
  BUILD_MINIMAL: "no"
  BUILD_DESKTOP: "no"
  ARMBIAN_REPO: "https://github.com/armbian/build"
  USE_CCACHE: "yes"
  KERNEL_CPUS: "0"
  ALLOW_ROOT: "yes"
  COLUMNS: "160"
  MANAGE_ACNG: "no"

stages:
  - build
  - notify

cache:
  key: armbian-cache-${CI_JOB_NAME}
  paths:
    - armbian/cache/
    - armbian/.git/

##############################################
# BUILD TEMPLATE
# All scripts are inline heredocs due to Armbian bug:
# userpatches scripts are ignored if pre-existing in repo.
# Everything must be generated at build time.
##############################################
.build_template:
  stage: build
  tags:
    - arm64
  when: manual
  timeout: 3h

  before_script:
    - echo "==========================================="
    - echo "StorLoko ARM Builder"
    - echo "Board: ${BOARD} | Branch: ${BRANCH} | Release: ${RELEASE}"
    - echo "==========================================="
    - git config --global --add safe.directory '*'
    - rm -rf armbian
    - git clone --depth 1 ${ARMBIAN_REPO} armbian
    - cd armbian
    # Setup cache symlinks for faster rebuilds
    - mkdir -p /armbian-cache/{git-bare,debs,toolchain,sources}
    - mkdir -p cache
    - rm -rf cache/{git-bare,debs,toolchain,sources}
    - ln -s /armbian-cache/git-bare cache/git-bare
    - ln -s /armbian-cache/debs cache/debs
    - ln -s /armbian-cache/toolchain cache/toolchain
    - ln -s /armbian-cache/sources cache/sources
    # Create userpatches directory
    - mkdir -p userpatches
    #
    # HEREDOC: customize-image.sh
    # This runs during Armbian build (chroot into target image)
    # Installs Docker - CasaOS installs on first boot
    #
    - |
      cat > userpatches/customize-image.sh <<'CUSTOMIZE_EOF'
      #!/bin/bash
      #
      # StorLoko customize-image.sh
      # Runs during Armbian build (chroot into target image)
      # Installs Docker only - CasaOS installed on first boot
      #
      set -e

      RELEASE=$1
      LINUXFAMILY=$2
      BOARD=$3
      BUILD_DESKTOP=$4

      echo "==========================================="
      echo "StorLoko Image Customization"
      echo "Board: ${BOARD}"
      echo "Release: ${RELEASE}"
      echo "==========================================="

      # Wait for apt locks (build system may still be running)
      wait_for_apt() {
          local max_wait=60
          local waited=0
          while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
                fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
              if [ $waited -ge $max_wait ]; then
                  echo "Timeout waiting for apt locks"
                  return 1
              fi
              echo "Waiting for apt locks..."
              sleep 2
              waited=$((waited + 2))
          done
      }

      wait_for_apt

      # Update package lists
      apt-get update

      # Install prerequisites
      apt-get install -y \
          curl \
          ca-certificates \
          gnupg \
          lsb-release

      # Install Docker
      echo "Installing Docker..."
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg

      echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
        $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
        tee /etc/apt/sources.list.d/docker.list > /dev/null

      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      # Enable Docker
      systemctl enable docker

      # Create firstboot script to install CasaOS
      echo "Setting up firstboot CasaOS installer..."
      cat > /usr/local/bin/storloko-firstboot.sh <<'FIRSTBOOT'
      #!/bin/bash
      set -e

      LOG="/var/log/storloko-firstboot.log"
      MARKER="/etc/storloko-firstboot-done"

      log() {
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*" | tee -a "$LOG"
      }

      if [ -f "$MARKER" ]; then
          log "First boot already completed"
          exit 0
      fi

      log "==========================================="
      log "StorLoko First Boot"
      log "==========================================="

      # Wait for network
      log "Waiting for network..."
      for i in {1..30}; do
          if ping -c1 -W2 1.1.1.1 >/dev/null 2>&1; then
              log "Network available"
              break
          fi
          sleep 2
      done

      # Install CasaOS
      log "Installing CasaOS..."
      export TERM=xterm
      curl -fsSL https://get.casaos.io | bash -s -- --no-input 2>&1 | tee -a "$LOG"

      log "==========================================="
      log "✅ First boot complete"
      log "==========================================="

      touch "$MARKER"
      systemctl disable storloko-firstboot.service
      FIRSTBOOT
      chmod +x /usr/local/bin/storloko-firstboot.sh

      # Create systemd service for firstboot
      cat > /etc/systemd/system/storloko-firstboot.service <<'SERVICE'
      [Unit]
      Description=StorLoko First Boot Setup
      After=network-online.target docker.service
      Wants=network-online.target
      ConditionPathExists=!/etc/storloko-firstboot-done

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/storloko-firstboot.sh
      RemainAfterExit=yes
      StandardOutput=journal
      StandardError=journal
      Environment=TERM=xterm

      [Install]
      WantedBy=multi-user.target
      SERVICE

      systemctl enable storloko-firstboot.service

      # Cleanup
      apt-get clean
      rm -rf /var/lib/apt/lists/*

      echo "==========================================="
      echo "✅ Customization complete"
      echo "   - Docker installed"
      echo "   - CasaOS will install on first boot"
      echo "==========================================="
      CUSTOMIZE_EOF
    - chmod +x userpatches/customize-image.sh
    - echo "✅ userpatches/customize-image.sh created"

  script:
    - echo "Starting Armbian build..."
    - |
      ALLOW_ROOT=yes \
      COLUMNS=${COLUMNS} \
      MANAGE_ACNG=${MANAGE_ACNG} \
      USE_CCACHE=${USE_CCACHE} \
      KERNEL_CPUS=${KERNEL_CPUS} \
      ./compile.sh \
        BOARD=${BOARD} \
        BRANCH=${BRANCH} \
        RELEASE=${RELEASE} \
        BUILD_MINIMAL=${BUILD_MINIMAL} \
        BUILD_DESKTOP=${BUILD_DESKTOP} \
        KERNEL_CONFIGURE=no \
        COMPRESS_OUTPUTIMAGE="sha,xz"

  after_script:
    - |
      BUILD_DATE=$(date +%Y-%m-%d)
      if [ -d "armbian/output/images" ]; then
        echo "==========================================="
        echo "✅ Build complete"
        echo "==========================================="
        cd armbian/output/images/
        ls -la
        # Upload logic would go here (WebDAV, S3, etc.)
        # Example: curl -T "*.img.xz" "https://your-server/builds/${BUILD_DATE}/"
      else
        echo "❌ No build artifacts found"
        exit 1
      fi

  artifacts:
    paths:
      - armbian/output/images/*.img.xz
      - armbian/output/images/*.sha
    expire_in: 1 week

##############################################
# BOARD JOBS
##############################################
build:rockpi-4cplus:
  extends: .build_template
  variables:
    BOARD: "rockpi-4cplus"

build:orangepi5-ultra:
  extends: .build_template
  variables:
    BOARD: "orangepi5-ultra"
    BRANCH: "vendor"

build:orangepi5pro:
  extends: .build_template
  variables:
    BOARD: "orangepi5pro"

build:orangepi4-lts:
  extends: .build_template
  variables:
    BOARD: "orangepi4-lts"

build:rpi4b:
  extends: .build_template
  variables:
    BOARD: "rpi4b"

build:uefi-x86:
  extends: .build_template
  tags:
    - amd64
  variables:
    BOARD: "uefi-x86"

##############################################
# NOTIFICATIONS (optional)
##############################################
notify:failure:
  stage: notify
  image: curlimages/curl:latest
  tags:
    - docker
  when: on_failure
  allow_failure: true
  script:
    - |
      # Add your notification logic here (Pushover, Slack, etc.)
      echo "Build failed for pipeline ${CI_PIPELINE_ID}"
      # Example Pushover:
      # curl -s -X POST https://api.pushover.net/1/messages.json \
      #   -d "token=$PUSHOVER_API_TOKEN" \
      #   -d "user=$PUSHOVER_USER_KEY" \
      #   -d "title=ARM Build Failed" \
      #   -d "message=Pipeline $CI_PIPELINE_ID failed"
