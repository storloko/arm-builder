name: vaultwarden
services:
  vaultwarden:
    cpu_shares: 90
    command: []
    container_name: vaultwarden
    deploy:
      resources:
        limits:
          memory: 11961M
        reservations:
          memory: "268435456"
    hostname: vaultwarden
    image: vaultwarden/server:1.30.1
    labels:
      icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Vaultwarden/icon.png
    ports:
      - target: 80
        published: "10380"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/vaultwarden/data
        target: /data
    x-casaos:
      ports:
        - container: "80"
          description:
            en_us: WebUI HTTP Port
      volumes:
        - container: /data
          description:
            en_us: Vaultwarden data directory.
    devices: []
    cap_add: []
    environment: []
    network_mode: bridge
    privileged: false
x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  author: StorLoko
  category: Utilities
  description:
    en_us: Alternative implementation of the Bitwarden server API written in Rust and compatible with upstream Bitwarden clients, perfect for self-hosted deployment.
  developer: Daniel Garcia
  hostname: vaultwarden.DEVICE_HOSTNAME.cust.storloko.com
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Vaultwarden/icon.png
  index: /
  is_uncontrolled: true
  main: vaultwarden
  port_map: "443"
  scheme: https
  store_app_id: vaultwarden
  tagline:
    en_us: A self-hosted Bitwarden server
  title:
    en_us: Vaultwarden
